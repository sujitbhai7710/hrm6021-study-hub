<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRM 6021 - Study Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap');

:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --bg-card: #1a2035;
  --bg-card-hover: #1e2642;
  --accent-1: #6366f1;
  --accent-2: #8b5cf6;
  --accent-3: #ec4899;
  --accent-4: #f59e0b;
  --accent-5: #10b981;
  --accent-6: #3b82f6;
  --accent-7: #ef4444;
  --accent-8: #06b6d4;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: #2d3a52;
  --gradient-1: linear-gradient(135deg, #6366f1, #8b5cf6);
  --gradient-2: linear-gradient(135deg, #ec4899, #f59e0b);
  --gradient-3: linear-gradient(135deg, #10b981, #06b6d4);
  --gradient-4: linear-gradient(135deg, #3b82f6, #6366f1);
  --gradient-5: linear-gradient(135deg, #f59e0b, #ef4444);
  --gradient-6: linear-gradient(135deg, #8b5cf6, #ec4899);
  --gradient-7: linear-gradient(135deg, #06b6d4, #10b981);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 30px rgba(99,102,241,0.15);
  --topic1: #6366f1;
  --topic2: #8b5cf6;
  --topic3: #ec4899;
  --topic4: #f59e0b;
  --topic5: #10b981;
  --topic6: #3b82f6;
  --topic7: #06b6d4;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== NAVBAR ===== */
.navbar {
  position: fixed; top:0; left:0; right:0; z-index:1000;
  background: rgba(10,14,26,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 70px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-brand {
  font-family: 'Poppins', sans-serif;
  font-weight: 800; font-size: 1.4rem;
  background: var(--gradient-1);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
.nav-brand span { font-weight: 400; opacity: 0.7; }
.nav-links { display: flex; gap: 0.5rem; }
.nav-btn {
  padding: 0.55rem 1.3rem; border-radius: 10px;
  border: 1px solid transparent; background: transparent;
  color: var(--text-secondary); font-size: 0.9rem; font-weight: 500;
  cursor: pointer; transition: all 0.3s; font-family: 'Inter';
}
.nav-btn:hover { background: var(--bg-card); color: var(--text-primary); }
.nav-btn.active {
  background: var(--gradient-1); color: #fff;
  border-color: transparent; box-shadow: 0 4px 15px rgba(99,102,241,0.3);
}

/* ===== HERO ===== */
.hero {
  margin-top: 70px; padding: 3rem 2rem 2rem;
  text-align: center;
  background: linear-gradient(180deg, rgba(99,102,241,0.08) 0%, transparent 100%);
}
.hero h1 {
  font-family: 'Poppins'; font-size: 2.8rem; font-weight: 800;
  background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
}
.hero p { color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
.hero-stats {
  display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem; flex-wrap: wrap;
}
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  padding: 1rem 1.8rem; text-align: center;
}
.stat-card .num { font-family:'Poppins'; font-size:1.8rem; font-weight:700; }
.stat-card .label { color: var(--text-muted); font-size:0.8rem; margin-top:0.2rem; }

/* ===== SECTIONS ===== */
.section { display: none; padding: 2rem; max-width: 1200px; margin: 0 auto; }
.section.active { display: block; }

/* ===== NOTES ===== */
.topic-group { margin-bottom: 2rem; }
.topic-header {
  display: flex; align-items: center; gap: 0.8rem;
  padding: 1rem 1.5rem; border-radius: 14px;
  cursor: pointer; transition: all 0.3s; margin-bottom: 0.5rem;
  border: 1px solid var(--border);
}
.topic-header:hover { transform: translateX(5px); }
.topic-header .icon {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; flex-shrink: 0;
}
.topic-header h2 { font-family:'Poppins'; font-size:1.15rem; font-weight:600; flex:1; }
.topic-header .arrow { transition: transform 0.3s; font-size:1.2rem; color: var(--text-muted); }
.topic-header.open .arrow { transform: rotate(90deg); }

.topic-content { display:none; padding: 0.5rem 0 0 0; }
.topic-content.show { display: block; }

.class-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 14px; padding: 1.3rem 1.5rem; margin-bottom: 0.8rem;
  transition: all 0.3s; position: relative; overflow: hidden;
}
.class-card::before {
  content:''; position:absolute; top:0; left:0; width:4px; height:100%;
}
.class-card:hover { border-color: rgba(99,102,241,0.3); box-shadow: var(--shadow-glow); }
.class-card h3 { font-family:'Poppins'; font-size:1rem; font-weight:600; margin-bottom:0.7rem; display:flex; align-items:center; gap:0.5rem; }
.class-card h3 .badge {
  font-size:0.65rem; padding:0.15rem 0.5rem; border-radius:6px;
  color:#fff; font-weight:600; letter-spacing:0.5px;
}
.note-point {
  padding: 0.4rem 0; padding-left: 1.2rem; position: relative;
  color: var(--text-secondary); font-size:0.92rem; line-height:1.6;
}
.note-point::before {
  content:''; position:absolute; left:0; top:0.65rem;
  width:8px; height:8px; border-radius:50%;
}
.highlight-box {
  background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
  border-radius: 10px; padding: 1rem 1.2rem; margin-top: 0.8rem;
}
.highlight-box .hl-title {
  font-weight:700; font-size:0.85rem; color: var(--accent-1); margin-bottom:0.4rem;
  text-transform: uppercase; letter-spacing: 1px;
}
.highlight-box p { color: var(--text-primary); font-size:0.92rem; line-height:1.6; }

.faq-section { margin-top: 0.8rem; }
.faq-item {
  background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.15);
  border-radius: 10px; padding: 0.7rem 1rem; margin-bottom: 0.4rem;
}
.faq-q { color: var(--accent-4); font-weight:600; font-size:0.88rem; }
.faq-a { color: var(--text-secondary); font-size:0.85rem; margin-top:0.2rem; padding-left:1rem; }

/* ===== MCQ SECTION ===== */
.mcq-controls {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;
  margin-bottom:1.5rem; padding:1rem 1.5rem;
  background: var(--bg-card); border:1px solid var(--border); border-radius:14px;
}
.toggle-wrap { display:flex; align-items:center; gap:0.7rem; }
.toggle-wrap label { color: var(--text-secondary); font-size:0.9rem; font-weight:500; }
.toggle {
  position:relative; width:52px; height:28px; background: var(--border);
  border-radius:14px; cursor:pointer; transition: background 0.3s;
}
.toggle.on { background: var(--accent-5); }
.toggle .knob {
  position:absolute; top:3px; left:3px; width:22px; height:22px;
  background:#fff; border-radius:50%; transition: transform 0.3s;
}
.toggle.on .knob { transform: translateX(24px); }

.mcq-topic-tabs { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1.5rem; }
.mcq-tab {
  padding:0.5rem 1rem; border-radius:10px; border:1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary);
  font-size:0.82rem; font-weight:500; cursor:pointer; transition: all 0.3s;
}
.mcq-tab:hover { border-color: var(--accent-1); color: var(--text-primary); }
.mcq-tab.active { background: var(--gradient-1); color:#fff; border-color:transparent; }

.mcq-card {
  background: var(--bg-card); border:1px solid var(--border); border-radius:14px;
  padding:1.5rem; margin-bottom:1rem; transition: all 0.3s;
}
.mcq-card:hover { border-color: rgba(99,102,241,0.3); }
.mcq-q-text { font-weight:600; font-size:1rem; margin-bottom:1rem; line-height:1.5; }
.mcq-q-num {
  display:inline-block; padding:0.15rem 0.6rem; border-radius:6px;
  font-size:0.75rem; font-weight:700; color:#fff; margin-right:0.5rem;
}
.mcq-options { display:flex; flex-direction:column; gap:0.5rem; }
.mcq-opt {
  padding:0.7rem 1rem; border-radius:10px; border:1px solid var(--border);
  background: rgba(255,255,255,0.02); cursor:pointer; transition: all 0.3s;
  display:flex; align-items:center; gap:0.7rem; font-size:0.92rem;
}
.mcq-opt:hover { border-color: var(--accent-1); background: rgba(99,102,241,0.05); }
.mcq-opt .opt-letter {
  width:28px; height:28px; border-radius:8px; display:flex; align-items:center;
  justify-content:center; font-weight:700; font-size:0.8rem; flex-shrink:0;
  background: var(--border); color: var(--text-secondary);
}
.mcq-opt.correct { border-color: var(--accent-5); background: rgba(16,185,129,0.1); }
.mcq-opt.correct .opt-letter { background: var(--accent-5); color:#fff; }
.mcq-opt.wrong { border-color: var(--accent-7); background: rgba(239,68,68,0.1); }
.mcq-opt.wrong .opt-letter { background: var(--accent-7); color:#fff; }

.reveal-btn {
  margin-top:0.8rem; padding:0.5rem 1.2rem; border-radius:8px;
  background: var(--gradient-1); color:#fff; border:none;
  font-size:0.82rem; font-weight:600; cursor:pointer; transition: all 0.3s;
  font-family:'Inter';
}
.reveal-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,0.3); }

.answer-reveal {
  margin-top:0.8rem; padding:0.8rem 1rem; border-radius:10px;
  background: rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.2);
  display:none; font-size:0.9rem;
}
.answer-reveal.show { display:block; }
.answer-reveal .correct-label { color: var(--accent-5); font-weight:700; }

/* ===== TEST SECTION ===== */
.test-setup {
  background: var(--bg-card); border:1px solid var(--border);
  border-radius:18px; padding:2rem; max-width:700px; margin:0 auto;
}
.test-setup h2 { font-family:'Poppins'; font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; text-align:center; }
.test-field { margin-bottom:1.2rem; }
.test-field label { display:block; color: var(--text-secondary); font-size:0.85rem; font-weight:600; margin-bottom:0.4rem; text-transform:uppercase; letter-spacing:0.5px; }
.test-field input[type="number"] {
  width:100%; padding:0.7rem 1rem; border-radius:10px;
  border:1px solid var(--border); background: var(--bg-secondary);
  color: var(--text-primary); font-size:1rem; font-family:'Inter';
}
.test-field input:focus { outline:none; border-color: var(--accent-1); }
.topic-checkboxes { display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; }
.topic-check {
  display:flex; align-items:center; gap:0.5rem; padding:0.5rem 0.8rem;
  border-radius:10px; border:1px solid var(--border); background: var(--bg-secondary);
  cursor:pointer; transition: all 0.3s; font-size:0.85rem;
}
.topic-check:hover { border-color: var(--accent-1); }
.topic-check.selected { border-color: var(--accent-5); background: rgba(16,185,129,0.1); }
.topic-check input { display:none; }
.topic-check .check-icon { width:20px; height:20px; border-radius:6px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; transition: all 0.3s; flex-shrink:0; }
.topic-check.selected .check-icon { background: var(--accent-5); border-color: var(--accent-5); }
.topic-check.selected .check-icon::after { content:'✓'; color:#fff; font-size:0.7rem; font-weight:700; }

.start-test-btn {
  width:100%; padding:0.9rem; border-radius:12px; border:none;
  background: var(--gradient-1); color:#fff; font-size:1rem; font-weight:700;
  cursor:pointer; transition: all 0.3s; font-family:'Poppins'; margin-top:0.5rem;
}
.start-test-btn:hover { transform:translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }
.start-test-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* Test In Progress */
.test-area { display:none; max-width:800px; margin:0 auto; }
.test-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:1rem 1.5rem; background: var(--bg-card); border:1px solid var(--border);
  border-radius:14px; margin-bottom:1.5rem;
}
.test-timer { font-family:'Poppins'; font-size:1.5rem; font-weight:700; color: var(--accent-4); }
.test-progress { color: var(--text-secondary); font-size:0.9rem; }
.test-progress-bar { height:4px; background: var(--border); border-radius:2px; margin-top:0.5rem; }
.test-progress-fill { height:100%; border-radius:2px; background: var(--gradient-1); transition: width 0.3s; }

.test-question-card {
  background: var(--bg-card); border:1px solid var(--border); border-radius:16px;
  padding:2rem; margin-bottom:1rem;
}
.test-q-num { font-size:0.8rem; color: var(--accent-1); font-weight:700; margin-bottom:0.5rem; }
.test-q-text { font-size:1.1rem; font-weight:600; line-height:1.5; margin-bottom:1.2rem; }
.test-options { display:flex; flex-direction:column; gap:0.6rem; }
.test-opt {
  padding:0.8rem 1.2rem; border-radius:12px; border:1px solid var(--border);
  background: rgba(255,255,255,0.02); cursor:pointer; transition: all 0.3s;
  display:flex; align-items:center; gap:0.8rem; font-size:0.95rem;
}
.test-opt:hover:not(.disabled) { border-color: var(--accent-1); background: rgba(99,102,241,0.05); }
.test-opt.selected { border-color: var(--accent-6); background: rgba(59,130,246,0.1); }
.test-opt.selected .opt-letter { background: var(--accent-6); color:#fff; }
.test-opt.correct-answer { border-color: var(--accent-5); background: rgba(16,185,129,0.12); }
.test-opt.correct-answer .opt-letter { background: var(--accent-5); color:#fff; }
.test-opt.wrong-answer { border-color: var(--accent-7); background: rgba(239,68,68,0.12); }
.test-opt.wrong-answer .opt-letter { background: var(--accent-7); color:#fff; }
.test-opt.disabled { cursor:default; }

.test-feedback {
  margin-top:1rem; padding:0.8rem 1rem; border-radius:10px; font-size:0.9rem; font-weight:600;
  display:none;
}
.test-feedback.correct-fb { display:block; background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); color: var(--accent-5); }
.test-feedback.wrong-fb { display:block; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color: var(--accent-7); }
.test-feedback.skip-fb { display:block; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); color: var(--accent-4); }

.test-nav { display:flex; justify-content:space-between; gap:0.5rem; margin-top:1rem; }
.test-nav-btn {
  padding:0.7rem 1.5rem; border-radius:10px; border:1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); font-size:0.9rem;
  font-weight:600; cursor:pointer; transition: all 0.3s; font-family:'Inter';
}
.test-nav-btn:hover { border-color: var(--accent-1); }
.test-nav-btn.primary { background: var(--gradient-1); border-color:transparent; }
.test-nav-btn:disabled { opacity:0.4; cursor:not-allowed; }

/* Results */
.test-results { display:none; max-width:800px; margin:0 auto; }
.result-header {
  text-align:center; padding:2rem; background: var(--bg-card);
  border:1px solid var(--border); border-radius:18px; margin-bottom:1.5rem;
}
.result-score { font-family:'Poppins'; font-size:3.5rem; font-weight:800; }
.result-score.great { background: var(--gradient-3); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.result-score.good { background: var(--gradient-1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.result-score.poor { background: var(--gradient-5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.result-detail { color: var(--text-secondary); font-size:1rem; margin-top:0.5rem; }
.result-breakdown {
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem; margin-top:1.5rem;
}
.breakdown-card { background: var(--bg-secondary); border-radius:12px; padding:1rem; text-align:center; }
.breakdown-card .bd-num { font-family:'Poppins'; font-size:1.8rem; font-weight:700; }
.breakdown-card .bd-label { color: var(--text-muted); font-size:0.75rem; margin-top:0.2rem; text-transform:uppercase; letter-spacing:0.5px; }

.result-question {
  background: var(--bg-card); border:1px solid var(--border);
  border-radius:14px; padding:1.2rem 1.5rem; margin-bottom:0.8rem;
}
.result-question.correct-q { border-left:4px solid var(--accent-5); }
.result-question.wrong-q { border-left:4px solid var(--accent-7); }
.result-question.skipped-q { border-left:4px solid var(--accent-4); }
.rq-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; }
.rq-status { padding:0.2rem 0.7rem; border-radius:6px; font-size:0.75rem; font-weight:700; color:#fff; }
.rq-status.correct { background: var(--accent-5); }
.rq-status.wrong { background: var(--accent-7); }
.rq-status.skipped { background: var(--accent-4); }
.rq-text { font-weight:600; font-size:0.95rem; margin-bottom:0.5rem; }
.rq-your-ans { font-size:0.85rem; color: var(--text-secondary); }
.rq-correct-ans { font-size:0.85rem; color: var(--accent-5); font-weight:600; margin-top:0.2rem; }

.retry-btn {
  display:block; margin:2rem auto; padding:0.9rem 3rem; border-radius:12px;
  border:none; background: var(--gradient-1); color:#fff; font-size:1rem;
  font-weight:700; cursor:pointer; font-family:'Poppins'; transition: all 0.3s;
}
.retry-btn:hover { transform:translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-1); }

/* ===== ANIMATIONS ===== */
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.fade-in { animation: fadeIn 0.4s ease-out; }

@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* ===== RESPONSIVE ===== */
@media(max-width:768px) {
  .hero h1 { font-size:1.8rem; }
  .navbar { padding:0 1rem; }
  .nav-btn { padding:0.4rem 0.8rem; font-size:0.8rem; }
  .section { padding:1rem; }
  .topic-checkboxes { grid-template-columns:1fr; }
  .result-breakdown { grid-template-columns:1fr; }
  .test-header { flex-direction:column; gap:0.5rem; }
}

/* Back to top */
.back-top {
  position:fixed; bottom:2rem; right:2rem; width:44px; height:44px;
  border-radius:12px; background: var(--gradient-1); color:#fff;
  border:none; cursor:pointer; font-size:1.2rem; display:none;
  align-items:center; justify-content:center; z-index:999;
  box-shadow: 0 4px 15px rgba(99,102,241,0.3); transition: all 0.3s;
}
.back-top:hover { transform:translateY(-3px); }

/* ===== Notes Search Bar ===== */
.notes-search-wrap {
  position: sticky; top: 0; z-index: 40;
  background: var(--bg, #f8fafc);
  padding: 14px 1.5rem 12px;
  border-bottom: 1px solid var(--border, #e2e8f0);
  box-shadow: 0 2px 10px rgba(15,23,42,0.04);
}
.notes-search-box {
  position: relative; max-width: 900px; margin: 0 auto;
}
.notes-search-box input {
  width: 100%;
  padding: 13px 44px 13px 46px;
  font-size: 15px;
  font-family: inherit;
  border: 2px solid var(--border, #e2e8f0);
  border-radius: 12px;
  outline: none;
  background: #fff;
  color: var(--text-primary, #0f172a);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.notes-search-box input:focus {
  border-color: var(--topic1, #6366f1);
  box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
}
.nsb-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 18px; color: var(--text-secondary, #64748b); pointer-events: none;
}
.nsb-clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  border: none; background: var(--border, #e2e8f0); color: var(--text-primary, #0f172a);
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  font-size: 16px; line-height: 1; padding: 0; display: none;
}

function filterMcq(topicIdx, el) {
  document.querySelectorAll('.mcq-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentMcqTopic = topicIdx;
  renderMcqCards(topicIdx);
}

function renderMcqCards(topicIdx) {
  const container = document.getElementById('mcq-container');
  const questions = topicIdx === 'all' ? MCQ_DATA : MCQ_DATA.filter(m => m.topic === topicIdx);
  document.getElementById('mcqCount').textContent = `${questions.length} Questions`;
  const letters = ['A','B','C','D'];
  let html = '';
  questions.forEach((q, i) => {
    const topicInfo = TOPICS[q.topic];
    const colorVar = `var(--topic${q.topic+1})`;
    html += `<div class="mcq-card fade-in" id="mcq-${i}">
      <div class="mcq-q-text">
        <span class="mcq-q-num" style="background:${colorVar}">Q${i+1}</span>
        <span style="font-size:0.7rem;padding:0.1rem 0.5rem;border-radius:5px;background:rgba(${getRgbVals(q.topic)},0.15);color:${colorVar};margin-left:0.3rem">${topicInfo.name}</span>
        ${q.q}
      </div>
      <div class="mcq-options" id="mcq-opts-${i}">`;
    q.opts.forEach((opt, oi) => {
      html += `<div class="mcq-opt" onclick="selectMcqOpt(${i},${oi})" id="mcq-opt-${i}-${oi}">
        <div class="opt-letter">${letters[oi]}</div>
        <span>${opt}</span>
      </div>`;
    });
    html += `</div>
      <button class="reveal-btn" onclick="revealAnswer(${i})">👁 Reveal Answer</button>
      <div class="answer-reveal" id="mcq-ans-${i}">✅ Correct Answer: <span class="correct-label">${letters[q.correct]}. ${q.opts[q.correct]}</span></div>
    </div>`;
  });
  container.innerHTML = html;
  if(showAllAnswers) applyShowAll(true);
}

function selectMcqOpt(qIdx, optIdx) {
  const q = (currentMcqTopic === 'all' ? MCQ_DATA : MCQ_DATA.filter(m => m.topic === currentMcqTopic))[qIdx];
  const opts = document.querySelectorAll(`#mcq-opts-${qIdx} .mcq-opt`);
  opts.forEach((o, i) => {
    o.classList.remove('correct','wrong');
    if(i === q.correct) o.classList.add('correct');
    else if(i === optIdx && optIdx !== q.correct) o.classList.add('wrong');
  });
}

function revealAnswer(qIdx) {
  document.getElementById(`mcq-ans-${qIdx}`).classList.add('show');
  const q = (currentMcqTopic === 'all' ? MCQ_DATA : MCQ_DATA.filter(m => m.topic === currentMcqTopic))[qIdx];
  const opts = document.querySelectorAll(`#mcq-opts-${qIdx} .mcq-opt`);
  opts.forEach((o,i) => { if(i === q.correct) o.classList.add('correct'); });
}

function toggleShowAll() {
  showAllAnswers = !showAllAnswers;
  document.getElementById('showAllToggle').classList.toggle('on', showAllAnswers);
  applyShowAll(showAllAnswers);
}

function applyShowAll(show) {
  const questions = currentMcqTopic === 'all' ? MCQ_DATA : MCQ_DATA.filter(m => m.topic === currentMcqTopic);
  questions.forEach((q,i) => {
    const ansEl = document.getElementById(`mcq-ans-${i}`);
    if(ansEl) {
      if(show) ansEl.classList.add('show');
      else ansEl.classList.remove('show');
    }
    const opts = document.querySelectorAll(`#mcq-opts-${i} .mcq-opt`);
    opts.forEach((o,j) => {
      if(show && j === q.correct) o.classList.add('correct');
      else if(!show) o.classList.remove('correct');
    });
  });
}

    const wasSelected = el.classList.contains('selected');
    document.querySelectorAll('.topic-check').forEach(tc => {
      if(wasSelected) tc.classList.remove('selected');
      else tc.classList.add('selected');
    });
    selectedTestTopics = wasSelected ? new Set() : new Set([-1,0,1,2,3,4,5,6]);
  } else {
    el.classList.toggle('selected');
    if(el.classList.contains('selected')) selectedTestTopics.add(idx);
    else selectedTestTopics.delete(idx);
    // Update "Select All"
    const allCheck = document.querySelector('.topic-check[data-topic="-1"]');
    if(selectedTestTopics.size >= 7) allCheck.classList.add('selected');
    else allCheck.classList.remove('selected');
    if(!selectedTestTopics.has(-1) && selectedTestTopics.size === 7) selectedTestTopics.add(-1);
    if(selectedTestTopics.has(-1) && selectedTestTopics.size < 8) selectedTestTopics.delete(-1);
  }
}

function startTest() {
  const topics = [...selectedTestTopics].filter(t => t >= 0);
  if(topics.length === 0) { alert('Please select at least one topic!'); return; }
  
  const totalQ = parseInt(document.getElementById('testQCount').value) || 20;
  const timeLimit = parseInt(document.getElementById('testTimeLimit').value) || 30;
  
  // Gather questions for selected topics
  let pool = MCQ_DATA.filter(m => topics.includes(m.topic));
  // Shuffle pool
  pool = shuffleArray([...pool]);
  
  const questions = pool.slice(0, Math.min(totalQ, pool.length));
  if(questions.length < totalQ) {
    document.getElementById('testQCount').value = questions.length;
  }
  
  testState = {
    questions: questions.map(q => ({
      ...q,
      options: shuffleWithIndex([...q.opts], q.correct),
      userAnswer: null,
      answered: false,
      skipped: false
    })),
    currentIndex: 0,
    totalQuestions: questions.length,
    timeLimit: timeLimit * 60,
    timeRemaining: timeLimit * 60,
    timer: null,
    finished: false
  };
  
  document.getElementById('testSetup').style.display = 'none';
  document.getElementById('testArea').style.display = 'block';
  document.getElementById('testResults').style.display = 'none';
  
  startTimer();
  renderTestQuestion();
}

function shuffleArray(arr) {
  for(let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleWithIndex(opts, correctIdx) {
  const indexed = opts.map((o,i) => ({text:o, isCorrect:i===correctIdx}));
  const shuffled = shuffleArray(indexed);
  return shuffled.map((s,i) => ({...s, displayIdx:i}));
}

function startTimer() {
  testState.timer = setInterval(() => {
    testState.timeRemaining--;
    updateTimerDisplay();
    if(testState.timeRemaining <= 0) {
      clearInterval(testState.timer);
      finishTest();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(testState.timeRemaining / 60);
  const secs = testState.timeRemaining % 60;
  const timerEl = document.getElementById('testTimer');
  timerEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  if(testState.timeRemaining < 60) timerEl.style.color = 'var(--accent-7)';
  else if(testState.timeRemaining < 180) timerEl.style.color = 'var(--accent-4)';
  else timerEl.style.color = 'var(--accent-5)';
}

function renderTestQuestion() {
  const q = testState.questions[testState.currentIndex];
  const container = document.getElementById('testQuestionContainer');
  const letters = ['A','B','C','D'];
  const topicInfo = TOPICS[q.topic];
  const colorVar = `var(--topic${q.topic+1})`;
  
  let html = `<div class="test-question-card fade-in">
    <div class="test-q-num" style="color:${colorVar}">Topic: ${topicInfo.name}</div>
    <div class="test-q-text">Question ${testState.currentIndex+1} of ${testState.totalQuestions}<br>${q.q}</div>
    <div class="test-options" id="test-opts">`;
  
  q.options.forEach((opt, i) => {
    const isSelected = q.userAnswer === i;
    const isDisabled = q.answered ? 'disabled' : '';
    let extraClass = '';
    if(q.answered) {
      if(opt.isCorrect) extraClass = 'correct-answer';
      else if(isSelected && !opt.isCorrect) extraClass = 'wrong-answer';
    } else if(isSelected) extraClass = 'selected';
    
    html += `<div class="test-opt ${extraClass} ${isDisabled?'disabled':''}" onclick="selectTestOpt(${i})">
      <div class="opt-letter">${letters[i]}</div>
      <span>${opt.text}</span>
    </div>`;
  });
  html += `</div>`;
  
  if(q.answered) {
    const fb = document.getElementById('test-feedback');
    let fbClass = '', fbText = '';
    if(q.skipped) { fbClass = 'skip-fb'; fbText = '⏭ Question skipped'; }
    else {
      const selectedOpt = q.options[q.userAnswer];
      if(selectedOpt && selectedOpt.isCorrect) { fbClass = 'correct-fb'; fbText = '✅ Correct! Well done!'; }
      else { fbClass = 'wrong-fb'; fbText = `❌ Wrong! Correct answer: ${q.options.find(o=>o.isCorrect).text}`; }
    }
    html += `<div class="test-feedback ${fbClass}">${fbText}</div>`;
  }
  
  html += `<div id="test-feedback"></div></div>`;
  container.innerHTML = html;
  
  // Update progress
  document.getElementById('testProgress').textContent = `Q ${testState.currentIndex+1}/${testState.totalQuestions}`;
  document.getElementById('testProgressFill').style.width = `${((testState.currentIndex+1)/testState.totalQuestions)*100}%`;
  
  // Update nav buttons
  document.getElementById('prevBtn').disabled = testState.currentIndex === 0;
  const isLast = testState.currentIndex === testState.totalQuestions - 1;
  const nextBtn = document.getElementById('nextBtn');
  if(isLast) { nextBtn.textContent = '🏁 Finish Test'; nextBtn.onclick = finishTest; }
  else { nextBtn.textContent = 'Next ➡'; nextBtn.onclick = nextQuestion; }
}

function selectTestOpt(optIdx) {
  const q = testState.questions[testState.currentIndex];
  if(q.answered) return;
  
  q.userAnswer = optIdx;
  q.answered = true;
  q.skipped = false;
  renderTestQuestion();
}

function skipQuestion() {
  const q = testState.questions[testState.currentIndex];
  if(!q.answered) {
    q.skipped = true;
    q.answered = true;
  }
  if(testState.currentIndex < testState.totalQuestions - 1) nextQuestion();
  else finishTest();
}

function nextQuestion() {
  if(testState.currentIndex < testState.totalQuestions - 1) {
    testState.currentIndex++;
    renderTestQuestion();
  }
}

function prevQuestion() {
  if(testState.currentIndex > 0) {
    testState.currentIndex--;
    renderTestQuestion();
  }
}

function finishTest() {
  if(testState.timer) clearInterval(testState.timer);
  testState.finished = true;
  
  document.getElementById('testArea').style.display = 'none';
  document.getElementById('testResults').style.display = 'block';
  
  let correct = 0, wrong = 0, skipped = 0;
  testState.questions.forEach(q => {
    if(q.skipped) skipped++;
    else if(q.userAnswer !== null && q.options[q.userAnswer] && q.options[q.userAnswer].isCorrect) correct++;
    else if(q.userAnswer !== null) wrong++;
    else skipped++;
  });
  
  const total = testState.totalQuestions;
  const pct = Math.round((correct/total)*100);
  const scoreClass = pct >= 80 ? 'great' : pct >= 50 ? 'good' : 'poor';
  const letters = ['A','B','C','D'];
  
  let html = `<div class="result-header fade-in">
    <div style="color:var(--text-muted);font-size:0.9rem;margin-bottom:0.5rem">TEST COMPLETE</div>
    <div class="result-score ${scoreClass}">${pct}%</div>
    <div class="result-detail">${correct} out of ${total} correct &middot; Score: ${correct}/${total} marks</div>
    <div class="result-breakdown">
      <div class="breakdown-card"><div class="bd-num" style="color:var(--accent-5)">${correct}</div><div class="bd-label">Correct</div></div>
      <div class="breakdown-card"><div class="bd-num" style="color:var(--accent-7)">${wrong}</div><div class="bd-label">Wrong</div></div>
      <div class="breakdown-card"><div class="bd-num" style="color:var(--accent-4)">${skipped}</div><div class="bd-label">Skipped</div></div>
    </div>
  </div>
  <h3 style="font-family:Poppins;margin:1.5rem 0 1rem;font-size:1.2rem">📋 Detailed Analysis</h3>`;
  
  testState.questions.forEach((q, i) => {
    let status, statusClass, qClass;
    if(q.skipped || q.userAnswer === null) { status = 'SKIPPED'; statusClass = 'skipped'; qClass = 'skipped-q'; }
    else if(q.options[q.userAnswer] && q.options[q.userAnswer].isCorrect) { status = 'CORRECT'; statusClass = 'correct'; qClass = 'correct-q'; }
    else { status = 'WRONG'; statusClass = 'wrong'; qClass = 'wrong-q'; }
    
    const correctOpt = q.options.find(o => o.isCorrect);
    const userOpt = q.userAnswer !== null ? q.options[q.userAnswer] : null;
    const topicInfo = TOPICS[q.topic];
    
    html += `<div class="result-question ${qClass} fade-in">
      <div class="rq-header">
        <span style="font-size:0.8rem;color:var(--text-muted)">Q${i+1} &middot; ${topicInfo.name}</span>
        <span class="rq-status ${statusClass}">${status}</span>
      </div>
      <div class="rq-text">${q.q}</div>`;
    if(userOpt && !userOpt.isCorrect) {
      html += `<div class="rq-your-ans" style="color:var(--accent-7)">Your answer: ${userOpt.text}</div>`;
    }
    if(status !== 'CORRECT') {
      html += `<div class="rq-correct-ans">Correct answer: ${correctOpt.text}</div>`;
    }
    html += `</div>`;
  });
  
  html += `<button class="retry-btn" onclick="resetTest()">🔄 Take Another Test</button>`;
  document.getElementById('testResults').innerHTML = html;
}

function resetTest() {
  testState = null;
  selectedTestTopics = new Set();
  document.getElementById('testSetup').style.display = 'block';
  document.getElementById('testArea').style.display = 'none';
  document.getElementById('testResults').style.display = 'none';
  renderTestSetup();
}

window.addEventListener('scroll', () => {
  const btn = document.getElementById('backTop');
  if(window.scrollY > 300) btn.style.display = 'flex';
  else btn.style.display = 'none';

// ===== NOTES: AUTO-EXPAND ALL TOPICS + SEARCH =====
(function() {
  // Auto-expand every topic so all notes are visible continuously (no collapse)
  document.querySelectorAll('#notes-container .topic-header').forEach(h => h.classList.add('open'));
  document.querySelectorAll('#notes-container .topic-content').forEach(c => c.classList.add('show'));

  // Inject a "no results" placeholder inside notes-container
  const notesContainer = document.getElementById('notes-container');
  const noResults = document.createElement('div');
  noResults.className = 'ns-no-results';
  noResults.id = 'notesNoResults';
  noResults.innerHTML = '<div class="big">🔍</div><div>No matching notes found. Try a different keyword.</div>';
  notesContainer.appendChild(noResults);

  const input = document.getElementById('notesSearch');
  const clearBtn = document.getElementById('notesSearchClear');
  const meta = document.getElementById('notesSearchMeta');

  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // Cache original HTML of every searchable element so we can reset highlights cleanly
  const originals = new WeakMap();
  function cacheOriginals() {
    document.querySelectorAll('#notes-container .note-point, #notes-container .faq-item, #notes-container .highlight-box p, #notes-container .class-card h3').forEach(el => {
      if (!originals.has(el)) originals.set(el, el.innerHTML);
    });
  }
  cacheOriginals();

  function resetHighlight(el) {
    if (originals.has(el)) el.innerHTML = originals.get(el);
  }

  function highlight(el, query) {
    if (!query) return;
    const re = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
    const textNodes = [];
    let n;
    while ((n = walker.nextNode())) {
      if (n.parentElement && /^(SCRIPT|STYLE)$/.test(n.parentElement.tagName)) continue;
      if (n.nodeValue.trim()) textNodes.push(n);
    }
    textNodes.forEach(node => {
      if (re.test(node.nodeValue)) {
        const span = document.createElement('span');
        span.innerHTML = node.nodeValue.replace(new RegExp('(' + escapeRegExp(query) + ')', 'gi'), '<mark class="ns-hi">$1</mark>');
        node.parentNode.replaceChild(span, node);
      }
    });
  }

  function applyFilter() {
    cacheOriginals();
    const raw = input.value.trim();
    const q = raw.toLowerCase();
    const re = q ? new RegExp(escapeRegExp(q), 'i') : null;

    let totalMatches = 0;

    // Reset all ns-hidden / ns-match classes and clear highlights
    document.querySelectorAll('#notes-container .class-card, #notes-container .note-point, #notes-container .faq-item, #notes-container .highlight-box, #notes-container .topic-group').forEach(el => {
      el.classList.remove('ns-hidden', 'ns-match');
    });
    document.querySelectorAll('#notes-container .note-point, #notes-container .faq-item, #notes-container .highlight-box p, #notes-container .class-card h3').forEach(el => {
      resetHighlight(el);
    });

    if (!q) {
      meta.innerHTML = 'Showing all notes';
      clearBtn.style.display = 'none';
      noResults.classList.remove('show');
      return;
    }

    clearBtn.style.display = 'block';

    // Iterate class-cards; hide those with no matching content
    document.querySelectorAll('#notes-container .class-card').forEach(card => {
      // Search inside: title, note-points, faq-items, highlight-box (exam suggestions)
      const cardText = card.innerText.toLowerCase();
      const cardMatches = re.test(cardText);

      // Sub-filter: hide individual note-points and faq-items that don't match
      let subMatchCount = 0;
      card.querySelectorAll('.note-point, .faq-item').forEach(sub => {
        const subText = sub.innerText.toLowerCase();
        const matches = re.test(subText);
        sub.classList.toggle('ns-hidden', !matches);
        if (matches) {
          highlight(sub, q);
          subMatchCount++;
        }
      });

      // Highlight matching exam-suggestion paragraphs in the highlight-box
      let examMatchCount = 0;
      const highlightBox = card.parentElement.querySelector('.highlight-box');
      // The highlight-box is a sibling before the class-card; handled at topic-group level below
      card.querySelectorAll('.highlight-box p').forEach(p => {
        const matches = re.test(p.innerText.toLowerCase());
        if (matches) {
          highlight(p, q);
          examMatchCount++;
        }
      });

      const show = cardMatches;
      card.classList.toggle('ns-hidden', !show);
      if (show) {
        card.classList.add('ns-match');
        totalMatches += subMatchCount;
      }
    });

    // Highlight exam suggestions in standalone highlight-boxes (per-topic)
    document.querySelectorAll('#notes-container .highlight-box').forEach(hb => {
      const hbText = hb.innerText.toLowerCase();
      const matches = re.test(hbText);
      hb.classList.toggle('ns-hidden', !matches);
      if (matches) {
        let pMatch = 0;
        hb.querySelectorAll('p').forEach(p => {
          const pm = re.test(p.innerText.toLowerCase());
          if (pm) {
            highlight(p, q);
            pMatch++;
          } else {
            // hide non-matching suggestions inside a matching box? Keep them visible for context.
          }
        });
        totalMatches += pMatch;
      }
    });

    // Hide entire topic-group if no visible class-cards or highlight-boxes inside
    document.querySelectorAll('#notes-container .topic-group').forEach(tg => {
      const visibleCards = tg.querySelectorAll('.class-card:not(.ns-hidden)');
      const visibleHB = tg.querySelectorAll('.highlight-box:not(.ns-hidden)');
      tg.classList.toggle('ns-hidden', visibleCards.length === 0 && visibleHB.length === 0);
    });

    meta.innerHTML = '<b>' + totalMatches + '</b> match' + (totalMatches === 1 ? '' : 'es') + ' found';
    const anyVisible = document.querySelectorAll('#notes-container .class-card:not(.ns-hidden)').length > 0 ||
                       document.querySelectorAll('#notes-container .highlight-box:not(.ns-hidden)').length > 0;
    noResults.classList.toggle('show', !anyVisible);
  }

  input.addEventListener('input', applyFilter);
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { input.value = ''; applyFilter(); input.focus(); }
  });
  clearBtn.addEventListener('click', () => { input.value = ''; applyFilter(); input.focus(); });

  // Keyboard shortcut: '/' focuses the search box (only when on Notes tab)
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== input && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      const notesActive = document.getElementById('notes-section').classList.contains('active');
      if (notesActive) {
        e.preventDefault();
        input.focus();
      }
    }
  });
})();
</script>
